[package]
name = "tunnet-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed HTTP client for the Tunnet Local Management API"
repository = "https://github.com/tunnetio/Tunnet"
homepage = "https://tunnet.io"
documentation = "https://docs.rs/tunnet-client"
keywords = ["tunnet", "mesh", "vpn", "p2p", "client"]
categories = ["network-programming", "api-bindings"]
readme = "README.md"

[dependencies]
tunnet-common.workspace = true
anyhow.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "client"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation"] }
