name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "apps/docs/**"
      - "**.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "apps/docs/**"
      - "**.md"

jobs:
  rust:
    name: Rust
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold
        uses: rui314/setup-mold@v1
        with:
          make-default: false

      - name: Format
        run: cargo fmt --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --exclude tunnet-desktop --all-targets --all-features -- -D warnings

      - name: Clippy (tunnet-core no-default)
        run: cargo clippy -p tunnet-core --no-default-features -- -D warnings

      - name: Clippy (SDK managed)
        run: cargo clippy -p tunnet --no-default-features --features managed -- -D warnings

      - name: Clippy (SDK direct)
        run: cargo clippy -p tunnet --no-default-features --features direct -- -D warnings

  test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run workspace tests
        run: cargo nextest run --workspace --exclude tunnet-desktop --all-features

      - name: Run workspace doctests
        run: cargo test --workspace --exclude tunnet-desktop --all-features --doc
