name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.4.0)"
        required: true
        type: string
      dry-run:
        description: "Build everything but skip publish & release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-binaries-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RUST_TOOLCHAIN: "1.97"
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: [ubuntu-latest]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      dry-run: ${{ steps.meta.outputs.dry-run }}
    steps:
      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry-run }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Extract & validate version
        id: meta
        shell: bash
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          tag="${tag#v}"
          cargo_version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')

          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::Tag v${tag} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi

          echo "tag=v${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag}" >> "$GITHUB_OUTPUT"
          echo "dry-run=${{ steps.resolve.outputs.dry_run }}" >> "$GITHUB_OUTPUT"

          if echo "$tag" | grep -qE '(alpha|beta|rc|dev|pre)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-binaries:
    name: Binaries - ${{ matrix.target }}
    needs: [validate]
    runs-on: ${{ matrix.host }}
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: [ubuntu-latest]
            target: x86_64-unknown-linux-gnu
          - host: [ubuntu-latest]
            target: aarch64-unknown-linux-gnu
            cross: true
          - host: [ubuntu-latest]
            target: x86_64-unknown-linux-musl
            cross: true
          - host: [ubuntu-latest]
            target: aarch64-unknown-linux-musl
            cross: true
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: bin-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: bin-${{ matrix.target }}-

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p tunnet-agent -p tunnet-cli -p tunnet-control -p tunnet-relay

      - name: Build (cross)
        if: matrix.cross
        shell: bash
        run: |
          cross build --release --target ${{ matrix.target }} \
            -p tunnet-agent -p tunnet-cli -p tunnet-control -p tunnet-relay

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          target="${{ matrix.target }}"
          ext=""
          if [[ "$target" == *windows* ]]; then ext=".exe"; fi

          wintun_arch=""
          if [[ "$target" == "x86_64-pc-windows-msvc" ]]; then
            wintun_arch="amd64"
          elif [[ "$target" == "aarch64-pc-windows-msvc" ]]; then
            wintun_arch="arm64"
          fi

          resolve_wintun() {
            [ -n "$wintun_arch" ] || return 1
            for path in \
              "third_party/wintun/bin/${wintun_arch}/wintun.dll" \
              "crates/tunnet-agent/resources/wintun/${wintun_arch}/wintun.dll" \
              "crates/tunnet-agent/wintun.dll" \
              "target/${target}/release/wintun.dll"
            do
              if [ -f "$path" ]; then
                echo "$path"
                return 0
              fi
            done
            return 1
          }

          ensure_wintun() {
            [ -n "$wintun_arch" ] || return 0
            if resolve_wintun >/dev/null; then
              return 0
            fi
            echo "Downloading wintun.dll (${wintun_arch})…"
            curl -fsSL -o wintun.zip "https://www.wintun.net/builds/wintun-0.14.1.zip"
            unzip -q wintun.zip "wintun/bin/${wintun_arch}/wintun.dll"
            mkdir -p "third_party/wintun/bin/${wintun_arch}"
            cp "wintun/bin/${wintun_arch}/wintun.dll" "third_party/wintun/bin/${wintun_arch}/wintun.dll"
          }

          package_variant() {
            local variant="$1"
            shift
            local staging="${variant}-${version}-${target}"
            mkdir -p "$staging"

            for bin in "$@"; do
              src="target/${target}/release/${bin}${ext}"
              if [ -f "$src" ]; then
                cp "$src" "$staging/"
              fi
            done

            if [ "$variant" = "tunnet-headless" ] || [ "$variant" = "tunnet" ]; then
              ensure_wintun
              if wintun_src="$(resolve_wintun)"; then
                cp "$wintun_src" "$staging/wintun.dll"
              fi
            fi

            cp LICENSE README.md "$staging/" 2>/dev/null || true

            if [[ "$target" == *windows* ]]; then
              7z a "${staging}.zip" "$staging"
              echo "${staging}.zip"
            else
              tar czf "${staging}.tar.gz" "$staging"
              echo "${staging}.tar.gz"
            fi
          }

          assets=()
          assets+=("$(package_variant tunnet-headless tunnet tunnetd)")
          assets+=("$(package_variant tunnet-server tunnet-control tunnet-relay)")
          assets+=("$(package_variant tunnet tunnet tunnetd)")

          checksums=()
          for asset in "${assets[@]}"; do
            sha256sum "$asset" > "${asset}.sha256"
            checksums+=("${asset}.sha256")
          done

          {
            echo "assets<<EOF"
            printf '%s\n' "${assets[@]}"
            echo "EOF"
            echo "checksums<<EOF"
            printf '%s\n' "${checksums[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: |
            tunnet-headless-${{ needs.validate.outputs.version }}-${{ matrix.target }}.*
            tunnet-server-${{ needs.validate.outputs.version }}-${{ matrix.target }}.*
            tunnet-${{ needs.validate.outputs.version }}-${{ matrix.target }}.*
          if-no-files-found: error

  build-desktop-windows:
    name: Desktop - Windows NSIS
    needs: [validate, build-binaries]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - uses: actions/download-artifact@v8
        with:
          name: binaries-x86_64-pc-windows-msvc
          path: headless-artifact

      - name: Stage sidecar binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          target="x86_64-pc-windows-msvc"
          triple="x86_64-pc-windows-msvc"
          dest="apps/desktop/src-tauri/binaries"
          mkdir -p "$dest"

          archive=""
          for candidate in \
            "headless-artifact/tunnet-headless-${version}-${target}.zip" \
            "headless-artifact/tunnet-${version}-${target}.zip"
          do
            if [ -f "$candidate" ]; then
              archive="$candidate"
              break
            fi
          done
          [ -n "$archive" ] || { echo "::error::headless Windows archive not found"; exit 1; }

          unzip -q "$archive" -d headless-artifact
          extracted=""
          for dir in \
            "headless-artifact/tunnet-headless-${version}-${target}" \
            "headless-artifact/tunnet-${version}-${target}"
          do
            if [ -d "$dir" ]; then
              extracted="$dir"
              break
            fi
          done
          [ -n "$extracted" ] || { echo "::error::unexpected archive layout"; exit 1; }

          cp "$extracted/tunnet.exe" "$dest/tunnet-${triple}.exe"
          cp "$extracted/tunnetd.exe" "$dest/tunnetd-${triple}.exe"
          if [ -f "$extracted/wintun.dll" ]; then
            cp "$extracted/wintun.dll" "$dest/wintun.dll"
          else
            curl -fsSL -o wintun.zip "https://www.wintun.net/builds/wintun-0.14.1.zip"
            unzip -q wintun.zip "wintun/bin/amd64/wintun.dll"
            cp "wintun/bin/amd64/wintun.dll" "$dest/wintun.dll"
          fi

          # Enable sidecar bundling for release builds only (keeps local tauri
          # dev working when binaries are locked by a running service).
          node <<'NODE'
          const fs = require("fs");
          const confPath = "apps/desktop/src-tauri/tauri.conf.json";
          const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
          conf.bundle = conf.bundle || {};
          conf.bundle.externalBin = ["binaries/tunnet", "binaries/tunnetd"];
          conf.bundle.resources = ["binaries/wintun.dll"];
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");
          NODE

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build NSIS installer
        working-directory: apps/desktop
        env:
          TAURI_CI: true
        run: bun run tauri build

      - name: Collect NSIS installer
        shell: bash
        run: |
          mkdir -p nsis-out
          find . -path '*/bundle/nsis/*.exe' -print -exec cp {} nsis-out/ \;
          ls -la nsis-out/

      - name: Upload desktop installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-nsis
          path: nsis-out/*.exe
          if-no-files-found: error

  package-installers:
    name: Package install scripts
    needs: [validate]
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Stage installers
        shell: bash
        run: |
          cp scripts/install.sh scripts/install.ps1 .
          sha256sum install.sh > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: |
            install.sh
            install.ps1
            install.sh.sha256
            install.ps1.sha256
          if-no-files-found: error

  github-release:
    name: GitHub Release (draft)
    needs: [validate, build-binaries, build-desktop-windows, package-installers]
    if: needs.validate.outputs.dry-run != 'true'
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: desktop-windows-nsis
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: installers
          path: artifacts

      - name: Generate release notes
        shell: bash
        run: |
          version="${{ needs.validate.outputs.version }}"
          repo="${{ github.repository }}"
          {
            echo "## Installation"
            echo ""
            echo "### Linux / macOS (headless agent)"
            echo ""
            echo '```bash'
            echo "curl -fsSL https://github.com/${repo}/releases/latest/download/install.sh | sh"
            echo '```'
            echo ""
            echo "### Windows (PowerShell as Administrator)"
            echo ""
            echo '```powershell'
            echo "irm https://github.com/${repo}/releases/latest/download/install.ps1 | iex"
            echo '```'
            echo ""
            echo "### Windows Desktop (NSIS)"
            echo ""
            echo "Download the \`Tunnet_*_x64-setup.exe\` installer from the assets below."
          } > release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Tunnet ${{ needs.validate.outputs.tag }}
          body_path: release-notes.md
          draft: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.exe
            artifacts/install.sh
            artifacts/install.ps1

  attest:
    name: Attestation
    needs: [validate, build-binaries, github-release]
    if: needs.validate.outputs.dry-run != 'true'
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: artifacts
          merge-multiple: true

      - uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
