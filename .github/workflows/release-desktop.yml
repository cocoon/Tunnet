name: Release Desktop

on:
  push:
    tags:
      - "desktop-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Desktop tag (desktop-vX.Y.Z)"
        required: true
        type: string

concurrency:
  group: release-desktop-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.tag }}"
          [[ "$tag" =~ ^desktop-v([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?)$ ]] || { echo "::error::invalid Desktop tag $tag"; exit 1; }
          version="${tag#desktop-v}"
          cargo="$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)"
          package="$(jq -r .version apps/desktop/package.json)"
          config="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          [ "$version" = "$cargo" ] && [ "$version" = "$package" ] && [ "$version" = "$config" ] || {
            echo "::error::Desktop tag and version sources differ: tag=$version cargo=$cargo package=$package config=$config"
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  create-draft-release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Create Desktop draft release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft' >/tmp/is-draft 2>/dev/null; then
            [ "$(< /tmp/is-draft)" = true ] || {
              echo "::error::release $TAG already exists and is not a draft"
              exit 1
            }
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "Tunnet Desktop v$VERSION" \
            --generate-notes

  build-and-release:
    needs: [validate, create-draft-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.validate.outputs.tag }}
          releaseDraft: true
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: Tunnet_Desktop_[version]_[arch][setup].[ext]
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  publish-latest:
    needs: [validate, build-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Publish the stable Desktop download assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "latest.json" \
            --pattern "Tunnet_Desktop_*_x64-setup.exe" \
            --dir release-assets
          setup_path="$(find release-assets -maxdepth 1 -name 'Tunnet_Desktop_*_x64-setup.exe' -print -quit)"
          [ -n "$setup_path" ] || { echo "::error::Desktop setup asset was not published"; exit 1; }
          cp "$setup_path" release-assets/Tunnet_Desktop_x64-setup.exe
          if gh release view desktop-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit desktop-latest --repo "${{ github.repository }}" --title "Tunnet Desktop latest" --prerelease
          else
            gh release create desktop-latest --repo "${{ github.repository }}" --verify-tag --title "Tunnet Desktop latest" --prerelease
          fi
          gh release upload desktop-latest --repo "${{ github.repository }}" --clobber \
            release-assets/latest.json \
            release-assets/Tunnet_Desktop_x64-setup.exe
